<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/ap-favicon.png" />
    <link rel="apple-touch-icon" href="/ap-favicon.png" />

    <!-- Viewport — viewport-fit=cover for iPhone safe area / future PWA -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary metadata -->
    <title>Abhinav Perfumers CRM</title>
    <meta name="description" content="AI-powered lead capture and sales management platform for Abhinav Perfumers." />
    <meta name="author" content="Abhinav Perfumers" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Theme color (matches brand charcoal) -->
    <meta name="theme-color" content="#1a1a1a" />

    <!-- Mobile / PWA readiness -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta name="application-name" content="Abhinav Perfumers CRM" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Abhinav Perfumers CRM" />
    <meta property="og:description" content="AI-powered lead capture and sales management platform." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Abhinav Perfumers Lead Management System" />
    <meta property="og:site_name" content="Abhinav Perfumers CRM" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="AI-powered lead capture and sales management platform." />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:image:alt" content="Abhinav Perfumers Lead Management System" />
